spring.application.name=vantage-search

# Database Connection
spring.datasource.url=jdbc:postgresql://vantage_postgres:5432/vantage_search_db
spring.datasource.username=vantage_user
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Disable Open-Session-In-View so lazy collections must be materialised inside
# a service transaction; prevents N+1 queries during JSON serialisation.
spring.jpa.open-in-view=false

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=768

# Ollama embedding model (vector search)
spring.ai.ollama.base-url=http://host.docker.internal:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.options.model=llama3

# Actuator — health and prometheus are public; all other endpoints require auth
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized

# Admin credentials — APP_ADMIN_PASSWORD must be a {bcrypt} hash
# Generate: htpasswd -bnBC 10 "" your_password | tr -d ':\n'  -> prefix result with {bcrypt}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD}

# JWT Authentication — APP_JWT_SECRET must be a Base64-encoded value that decodes to at least 32 bytes
# Generate: openssl rand -base64 32
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Redis — used for distributed rate limiting
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Rate limiting — requests per IP per fixed window
app.rate-limit.capacity=60
app.rate-limit.refill-duration-seconds=60
# Only set to true when this service sits behind a trusted reverse proxy that sets X-Forwarded-For
app.rate-limit.trust-proxy=false
