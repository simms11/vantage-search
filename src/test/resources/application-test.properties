spring.ai.vectorstore.pgvector.initialize-schema=false

app.admin.username=admin
app.admin.password={noop}test-password
app.jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWZvci12YW50YWdlLXRlc3RzLW9ubHk=
app.jwt.expiration-ms=3600000

# High limit so tests never hit rate cap
app.rate-limit.capacity=10000
app.rate-limit.refill-duration-seconds=60
app.rate-limit.trust-proxy=false

# Tight timeouts so the WireMock latency test trips quickly
app.ai.connect-timeout-seconds=1
app.ai.read-timeout-seconds=2
